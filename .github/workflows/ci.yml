name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Shopware 6.7 / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the plugin in a throwaway Shopware
        env:
          PHP_IMAGE: php:${{ matrix.php }}-cli-alpine
        run: bash .agents/skills/verify-plugin/scripts/throwaway-shopware.sh
